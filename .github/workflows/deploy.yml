name: Textbook CI and publish
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: textbook-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npm run check:generated
      - run: npm run check:examples
      - name: Verify diagrams are published
        run: |
          for name in sampling-distribution confidence-coverage anova-decomposition; do test -s "dist/assets/$name.svg"; done
      - name: Verify all 58 chapter pages
        run: |
          test -s dist/index.html
          test -s dist/glossary.html
          test "$(find dist/chapters -maxdepth 1 -name '*.html' | wc -l)" -eq 58
          for n in $(seq -w 1 58); do test -s "dist/chapters/$n.html"; done
          grep -q 'mathjax@3.2.2' dist/chapters/58.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
