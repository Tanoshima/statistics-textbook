<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340" role="img" aria-labelledby="title desc">
<title id="title">観測値の分布と二人の標本平均の標本分布</title>
<desc id="desc">左は観測値0と2がそれぞれ確率0.5。右は独立な二人の平均が0、1、2を取る確率がそれぞれ0.25、0.5、0.25。</desc>
<rect width="920" height="340" rx="14" fill="#f7f9fb"/>
<g font-family="sans-serif" fill="#22364a"><text x="225" y="36" font-size="22" text-anchor="middle" font-weight="700">観測値 X</text><text x="680" y="36" font-size="22" text-anchor="middle" font-weight="700">二人の平均 X̄</text></g>
<g stroke="#b5c5d2" stroke-width="2"><path d="M65 264H400 M530 264H855"/><path d="M65 64V264 M530 64V264"/></g>
<g fill="#516b80" font-family="sans-serif" font-size="16"><text x="45" y="270" text-anchor="end">0</text><text x="45" y="105" text-anchor="end">0.5</text><text x="510" y="270" text-anchor="end">0</text><text x="510" y="105" text-anchor="end">0.5</text></g>
<g fill="#2d7797"><rect x="115" y="104" width="88" height="160" rx="5"/><rect x="270" y="104" width="88" height="160" rx="5"/></g>
<g fill="#368c7d"><rect x="570" y="184" width="72" height="80" rx="5"/><rect x="659" y="104" width="72" height="160" rx="5"/><rect x="748" y="184" width="72" height="80" rx="5"/></g>
<g fill="#22364a" font-family="sans-serif" font-size="17" text-anchor="middle"><text x="159" y="95">1/2</text><text x="314" y="95">1/2</text><text x="606" y="175">1/4</text><text x="695" y="95">1/2</text><text x="784" y="175">1/4</text><text x="159" y="292">0</text><text x="314" y="292">2</text><text x="606" y="292">0</text><text x="695" y="292">1</text><text x="784" y="292">2</text></g>
<g font-family="sans-serif" fill="#53687a" font-size="14" text-anchor="middle"><text x="225" y="320">元の観測値は 0 または 2</text><text x="680" y="320">平均は 1 も取り得る</text></g>
</svg>